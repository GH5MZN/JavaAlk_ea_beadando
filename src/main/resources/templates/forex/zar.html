<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">FOREX Zár</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments/topbar :: topbar}"></div>
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800" th:text="${title}">FOREX Zár</h1>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Pozíció zárása</h6>
                    </div>
                    <div class="card-body">
                        <form method="post" action="/forex-zar">
                            <div class="form-group">
                                <label for="tradeId">Trade ID:</label>
                                <input type="text" id="tradeId" name="tradeId" class="form-control" placeholder="Pl: 50, 123, 456..." required>
                                <small class="form-text text-muted">
                                    Add meg annak a pozíciónak a Trade ID-ját, amelyet le szeretnél zárni.
                                    A Trade ID-kat a <a href="/forex-poz">Nyitott pozíciók</a> oldalon találod.
                                </small>
                            </div>

                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-lock"></i> Pozíció zárása
                            </button>
                            <a href="/forex-poz" class="btn btn-secondary ml-2">
                                <i class="fas fa-arrow-left"></i> Vissza a pozíciókhoz
                            </a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
