<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">FOREX Poz</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments/topbar :: topbar}"></div>
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800" th:text="${title}">FOREX Poz</h1>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Nyitott pozíciók</h6>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}">
                            <div class="alert alert-danger" role="alert">
                                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                            </div>
                        </div>

                        <div th:if="${trades}" class="table-responsive">
                            <table class="table table-bordered table-striped" width="100%" cellspacing="0">
                                <thead class="thead-dark">
                                <tr>
                                    <th>Trade ID</th>
                                    <th>Instrument</th>
                                    <th>Mennyiség</th>
                                    <th>Nyitási ár</th>
                                    <th>Nem realizált P/L</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="t : ${trades}">
                                    <td th:text="${t.id}"></td>
                                    <td><strong th:text="${t.instrument}"></strong></td>
                                    <td th:text="${t.currentUnits}"></td>
                                    <td th:text="${t.price}"></td>
                                    <td th:text="${t.unrealizedPL}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <div th:unless="${trades}">
                            <div class="alert alert-info" role="alert">
                                <i class="fas fa-info-circle"></i> Jelenleg nincsenek nyitott pozíciók.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
