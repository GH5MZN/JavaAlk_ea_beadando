<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">FOREX HistÁr - Eredmény</title>
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="page-top">
<div id="wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <div th:replace="~{fragments/topbar :: topbar}"></div>
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800" th:text="${title}">FOREX HistÁr - Eredmény</h1>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">
                            Historikus árfolyam: <span th:text="${instrument}"></span> - <span th:text="${granularity}"></span>
                        </h6>
                    </div>
                    <div class="card-body">
                        <!-- Chart -->
                        <div class="mb-4">
                            <canvas id="myChart"></canvas>
                        </div>

                        <!-- Táblázat -->
                        <div th:utext="${data}"></div>

                        <div class="mt-4">
                            <a href="/forex-histar" class="btn btn-primary">
                                <i class="fas fa-arrow-left"></i> Vissza az űrlaphoz
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; Your Website 2025</span>
                </div>
            </div>
        </footer>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const ctx = document.getElementById('myChart');

    const labels = [/*[[${labels}]]*/];
    const dataClose = [/*[[${dataClose}]]*/];
    const dataHigh = [/*[[${dataHigh}]]*/];
    const dataLow = [/*[[${dataLow}]]*/];

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Záró árfolyam (Close)',
                    data: dataClose,
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    tension: 0.1
                },
                {
                    label: 'Legmagasabb (High)',
                    data: dataHigh,
                    borderColor: 'rgb(54, 162, 235)',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    tension: 0.1
                },
                {
                    label: 'Legalacsonyabb (Low)',
                    data: dataLow,
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    tension: 0.1
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Historikus árfolyam változás'
                }
            },
            scales: {
                y: {
                    beginAtZero: false
                }
            }
        }
    });
    /*]]>*/
</script>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
<script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
